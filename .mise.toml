[tools]
node = "24"

python = '3.14'
# 1.96 is the project toolchain; nightly is used only by the coverage
# subcommand (cargo +nightly llvm-cov), which needs `coverage(off)` markers.
rust = ['1.96', 'nightly']
zig = "0.16.0"
cargo-binstall = "1.23.0"


"cargo:cargo-zigbuild" = "0.23.4"
"cargo:cargo-nextest" = "0.9.146"
"cargo:cargo-llvm-cov" = "0.9.1"
# The documentation site: mdBook builds it, lychee checks its links.
"cargo:mdbook" = "0.5.4"
"cargo:lychee" = "0.24.2"

[workspace]
resolver = "3"
members = ["crates/*/*"]
# Without default members, a bare `cargo build` fails with "the workspace has no
# members".
default-members = ["crates/app/tramlines", "crates/lib/tramlines-core", "crates/lib/tramlines-md"]

[workspace.package]
version = "0.6.0"
authors = ["six5536 <10079653+six5536@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.96.0"
readme = "README.md"
license = "Elastic-2.0"
repository = "https://github.com/six5536/tramlines"
homepage = "https://github.com/six5536/tramlines"
keywords = ["markdown", "schema", "validation", "cli"]
categories = ["command-line-utilities", "text-processing"]

[workspace.dependencies]
# External dependencies (alphabetical)
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
comrak = { version = "1.1", default-features = false }
globset = "0.4"
ignore = "0.4"
jmespath = "0.5"
regex = "1.13"
regex-syntax = "0.8.12"
rusqlite = { version = "0.40", features = ["bundled"] }
saphyr = "0.1"
saphyr-parser = "0.1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
toml = "1.1"
toml_edit = "0.25"

# Dev dependencies
assert_cmd = "2.2"
insta = "1.47"
boon = "0.6"
proptest = "1.11"

# Internal crates
tramlines-core = { path = "crates/lib/tramlines-core", version = "0.6.0" }
tramlines-md = { path = "crates/lib/tramlines-md", version = "0.6.0" }

[workspace.lints.rust]
unsafe_code = "deny"
# cargo-llvm-cov sets the `coverage_nightly` cfg in the task coverage:report:rust,
# which runs on nightly. Declare it as expected, so that no toolchain warns that
# it is unknown.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"

# Optimise release builds for size
[profile.release]
opt-level = "z" # optimise for size rather than speed
strip = true # strip the debug information and symbols
lto = true # optimise at link time across all the crates
panic = "abort" # abort on a panic, without the cost of unwinding
codegen-units = 1 # build one code generation unit, so the compiler can optimise across the whole crate

[profile.test]
opt-level = 0
debug = 0
split-debuginfo = "unpacked" # on macOS, the linker skips dsymutil, which makes linking faster

# Optimise the dependencies of the tests, but not the workspace crates.
# The tests and property tests call the dependencies, such as the parsers and
# the regular expression engine, hundreds of times, so the dependencies build at
# opt-level 2 instead of 0. Cargo builds them only once, and after a change to a
# workspace crate it rebuilds only that crate, which stays quick because it is
# not optimised.
[profile.test.package."*"]
opt-level = 2

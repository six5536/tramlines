name: Publish

# This repository is the public mirror of tramlines. The export in the
# internal repository pushes one commit and one annotated tag for each
# release, with the release notes in the tag's message, and the tag starts this
# workflow. It builds the binaries from the exported tree, publishes the crates
# to crates.io and the packages to npm, creates the GitHub release, and deploys
# the documentation site. The internal repository ran the tests before the
# export, so this workflow runs none.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Never run two releases at once, and never cancel one in flight — a half-done
# publish is the worst outcome.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Is the tag coherent? Cheap checks first, so a typo fails in seconds.
  # ---------------------------------------------------------------------------
  meta:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A semver prerelease has a hyphen after the patch component.
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $version"

      - name: Tag matches every version in the tree
        run: node scripts/verify-version.mjs "${{ steps.v.outputs.version }}"

      # The export writes the release notes into the tag's message. A tag
      # without notes didn't come from the export.
      - name: The tag carries the release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is no annotated tag, so it has no release notes"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 2. Build each platform binary.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.pkg }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships static musl: no glibc floor to track, and it runs on
          # Alpine too. zigbuild supplies the C cross-compiler and sysroot for
          # the musl targets, so a dependency with C code does not break the
          # cross build later.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: linux-x64, builder: zigbuild }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, pkg: linux-arm64, builder: zigbuild }
          - { os: macos-latest, target: x86_64-apple-darwin, pkg: darwin-x64, builder: cargo }
          - { os: macos-latest, target: aarch64-apple-darwin, pkg: darwin-arm64, builder: cargo }
          # Windows builds natively on its own runner (msvc needs no cross
          # setup there). x64 only: Windows-on-ARM runs it under emulation, and
          # we never ship a binary no CI has executed.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: win32-x64, builder: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Version comes from rust-toolchain.toml; only the cross target is added
      # here, since that is per-matrix-entry and not a property of the toolchain.
      - name: Install the pinned toolchain and cross target
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-zigbuild

      # Version read from .mise.toml so CI and local dev cross-compile with the
      # same zig, rather than the action defaulting to "latest".
      - name: Read the pinned zig version
        if: matrix.builder == 'zigbuild'
        id: zig
        run: |
          version="$(grep -oE '^zig = "[^"]+"' .mise.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$version" ]; then
            echo "::error::could not read the zig version from .mise.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zig $version"

      # v2 or newer is required: Zig changed its tarball naming in 0.15 from
      # zig-<os>-<arch>-<ver> to zig-<arch>-<os>-<ver>, and v1 still builds the
      # old URL, so every mirror 404s.
      - name: Install zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p tramlines

      - name: Build (cargo)
        if: matrix.builder == 'cargo'
        run: cargo build --release --locked --target ${{ matrix.target }} -p tramlines

      - name: Stage binary into platform package
        shell: bash
        run: |
          bin="tramlines"
          case "${{ matrix.target }}" in *windows*) bin="tramlines.exe" ;; esac
          install -m 0755 "target/${{ matrix.target }}/release/$bin" \
            "packages/tramlines-${{ matrix.pkg }}/bin/$bin"

      - name: Assert Linux binaries are statically linked
        if: matrix.builder == 'zigbuild'
        run: |
          bin="packages/tramlines-${{ matrix.pkg }}/bin/tramlines"
          if readelf -l "$bin" | grep -q "program interpreter"; then
            echo "::error::$bin is dynamically linked; expected a static musl build"
            readelf -l "$bin" | grep "program interpreter"
            exit 1
          fi
          echo "$bin is static"

      # Behavioural smoke of the built artifact, on every target the runner
      # can execute: run the CLI and assert its output, JSON, and exit codes.
      # The aarch64 musl binary cannot run on the x64 ubuntu runner;
      # darwin-x64 runs on the arm64 runner via Rosetta.
      - name: Smoke-test the release binary
        if: matrix.pkg != 'linux-arm64'
        shell: bash
        run: |
          bin="packages/tramlines-${{ matrix.pkg }}/bin/tramlines"
          case "${{ matrix.target }}" in *windows*) bin="$bin.exe" ;; esac
          node scripts/release-smoke.mjs "$bin"

      # npm-pack the launcher and this platform package, then run the real
      # binary through the launcher. The launcher selects by the host's
      # platform/arch, so this runs only where the built package matches the
      # runner.
      - name: Smoke-test the npm launcher with the packed binary
        if: matrix.pkg == 'linux-x64' || matrix.pkg == 'darwin-arm64' || matrix.pkg == 'win32-x64'
        shell: bash
        run: node scripts/launcher-smoke.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: tramlines-${{ matrix.pkg }}
          path: packages/tramlines-${{ matrix.pkg }}/bin/tramlines*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Publish. Nothing here runs until the tag and the builds agree.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OpenID Connect token signs the npm provenance, and authenticates
      # trusted publishing on crates.io and npm.
      id-token: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NPM_TAG: ${{ needs.meta.outputs.npm_tag }}
      # The first publish of a name needs a token, because trusted publishing
      # can be set up only for a name that exists. After the first publish,
      # both secrets are deleted, and the job uses trusted publishing.
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place binaries into platform packages
        run: |
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            install -m 0755 "artifacts/tramlines-$pkg/tramlines" "packages/tramlines-$pkg/bin/tramlines"
          done
          install -m 0755 "artifacts/tramlines-win32-x64/tramlines.exe" \
            "packages/tramlines-win32-x64/bin/tramlines.exe"

      - name: Smoke-test the built binary
        run: |
          actual="$(./packages/tramlines-linux-x64/bin/tramlines --version)"
          expected="tramlines $VERSION"
          if [ "$actual" != "$expected" ]; then
            echo "::error::binary reports '$actual', expected '$expected'"
            exit 1
          fi
          echo "$actual"

      # A crate or a package whose version is already on its registry is
      # left out, as the publish steps skip it, because a dry run refuses a
      # published version too, and a run again after a half-failed release
      # would stop here.
      - name: Dry-run every publish before doing any of them
        run: |
          exclude=""
          for crate in tramlines-core tramlines-md tramlines; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'tramlines-publish (github.com/six5536/tramlines)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")"
            if [ "$status" = 200 ]; then exclude="$exclude --exclude $crate"; fi
          done
          if [ "$(echo $exclude | wc -w)" -lt 6 ]; then
            cargo publish --workspace --locked --dry-run $exclude
          fi
          for dir in packages/tramlines-linux-x64 packages/tramlines-linux-arm64 packages/tramlines-darwin-x64 \
                     packages/tramlines-darwin-arm64 packages/tramlines-win32-x64 packages/tramlines; do
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              npm publish "./$dir" --dry-run --tag "$NPM_TAG"
            fi
          done

      - name: Authenticate to crates.io with trusted publishing
        if: env.HAS_CARGO_TOKEN != 'true'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      # The crates go in the order of their dependencies, and cargo waits until
      # each one is in the index before the next one needs it. A crate whose
      # version is already on crates.io is skipped, so a run again after a
      # half-failed release publishes only what is missing.
      - name: Publish the crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
        run: |
          for crate in tramlines-core tramlines-md tramlines; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'tramlines-publish (github.com/six5536/tramlines)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")"
            if [ "$status" = 200 ]; then
              echo "$crate $VERSION is already published"
              continue
            fi
            cargo publish --locked -p "$crate"
          done

      # Platform packages first: the launcher declares them as
      # optionalDependencies, so publishing it first would briefly point users
      # at versions that do not exist yet. A package whose version is already
      # on npm is skipped.
      - name: Publish the packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/tramlines-linux-x64 packages/tramlines-linux-arm64 packages/tramlines-darwin-x64 \
                     packages/tramlines-darwin-arm64 packages/tramlines-win32-x64 packages/tramlines; do
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
              continue
            fi
            npm publish "./$dir" --tag "$NPM_TAG"
          done

  # ---------------------------------------------------------------------------
  # 4. GitHub Release: archives, checksums, notes.
  # ---------------------------------------------------------------------------
  github-release:
    name: github release
    needs: [meta, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build archives and checksums
        run: |
          mkdir -p dist/out
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            stage="dist/stage/tramlines-$VERSION-$pkg"
            mkdir -p "$stage"
            install -m 0755 "artifacts/tramlines-$pkg/tramlines" "$stage/tramlines"
            cp README.md LICENSE "$stage/"
            tar -czf "dist/out/tramlines-$VERSION-$pkg.tar.gz" -C dist/stage "tramlines-$VERSION-$pkg"
          done
          # Windows ships a .zip, the archive form its users expect.
          stage="dist/stage/tramlines-$VERSION-win32-x64"
          mkdir -p "$stage"
          install -m 0755 "artifacts/tramlines-win32-x64/tramlines.exe" "$stage/tramlines.exe"
          cp README.md LICENSE "$stage/"
          (cd dist/stage && zip -qr "../out/tramlines-$VERSION-win32-x64.zip" "tramlines-$VERSION-win32-x64")
          # The JSON Schema of a schema, which editors read to check its keys.
          # sokf-implements: CLI-15_AC-3
          cp schemas/tramlines-md.schema.json dist/out/
          cd dist/out && sha256sum ./*.tar.gz ./*.zip ./*.json > SHA256SUMS && cat SHA256SUMS

      # The notes are the body of the tag's message, which the export wrote
      # with git-cliff from the commits of the release.
      - name: Read the release notes from the tag
        run: |
          git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git for-each-ref "refs/tags/v${VERSION}" --format='%(contents:body)' > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::the tag v${VERSION} carries no release notes"
            exit 1
          fi
          cat dist/notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ env.VERSION }}
          body_path: dist/notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            dist/out/*.tar.gz
            dist/out/*.zip
            dist/out/tramlines-md.schema.json
            dist/out/SHA256SUMS

  # ---------------------------------------------------------------------------
  # 5. The documentation site, built from this tag. A prerelease leaves the
  #    site at the last release.
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    needs: [meta, github-release]
    if: needs.meta.outputs.prerelease != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ github.ref_name }}

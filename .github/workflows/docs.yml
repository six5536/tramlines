name: Docs

# Publishes the documentation site to GitHub Pages, built from one tag: the
# release calls it with the tag it published, and it can be run by hand to
# publish a past tag again, such as after a fix to its docs is tagged. A tag
# from before v0.5.0 has neither the action setup-tools nor the task
# release:check:docs, so its site stays as it was published.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag to build the site from.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: The tag to build the site from, such as v0.1.0.
        type: string
        required: true

permissions:
  contents: read

# One deployment at a time; a newer one waits for the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Only the tools of the site: node runs its build script, and mdBook and
      # lychee build it and check its links.
      - uses: ./.github/actions/setup-tools
        with:
          tools: node rust cargo-binstall cargo:mdbook cargo:lychee

      # Builds the site and checks the links between its pages, with the tools
      # above alone.
      - run: mise run release:check:docs
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          # Links to the knowledge store go to GitHub at the same tag.
          DOCS_REF: ${{ inputs.ref }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
